spring.application.name=spring-hello-world

# Hosting platforms inject the port to listen on. Fall back to 8080 locally.
server.port=${PORT:8080}

# Bind the IPv6 any-address rather than Spring's 0.0.0.0 default. On a
# dual-stack host this accepts IPv4 and IPv6 alike; binding IPv4-only makes
# the app unreachable behind an IPv6 router.
server.address=::
